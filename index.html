<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary Email Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        h1 {
            color: #4CAF50;
        }
        .email {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
        }
        .generate-btn {
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .generate-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Temporary Email Generator</h1>
        <button class="generate-btn" onclick="generateEmail()">Generate Email</button>
        <div id="email" class="email"></div>
    </div>

    <script>
        function generateEmail() {
            const domain = 'tempmailforfb.epizy.com'; // Use your domain here
            const randomPart = Math.floor(Math.random() * 10000000000); // Random number for unique email
            const email = `fb${randomPart}@${domain}`;
            document.getElementById('email').textContent = `Your Temporary Email: ${email}`;
        }
    </script>
</body>
</html>
